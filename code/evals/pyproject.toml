[project]
name = "olala-evals"
version = "0.1.0"
description = "Evaluation harness comparing quantized variants of Olala-v1.0-mini-7A1B with its bf16 reference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.2.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "inspect-ai>=0.3.291",
    "inspect-evals>=0.29.0",
    "instruction-following-eval",
    "langdetect>=1.0.9",
    "numpy>=2.5.5",
    "openai>=3.57.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv.sources]
instruction-following-eval = { git = "https://github.com/josejg/instruction_following_eval", rev = "0c495b2f95155e8b10acb919ae283bfb4d5be6e2" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "ANN", "S", "SIM", "C4", "RUF"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "S101", "S105", "S106", "S108", "S311", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not docker'"
markers = [
    "network: needs Hugging Face / dataset hosts (run with -m network)",
    "docker: needs a running Docker daemon (run with -m docker)",
]
