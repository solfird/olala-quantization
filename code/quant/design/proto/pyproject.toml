[project]
name = "moegptq-proto"
version = "0.0.1"
description = "CPU-only toy: per-expert GPTQ with routing-aware Hessians for a fused non-gated MoE layer (design study, not production code)"
requires-python = ">=3.12,<3.13"
# Same pins as ../../pyproject.toml (the fork's torch). olala-quant is used only for its NVFP4 rounding grid.
dependencies = ["torch==2.14.0", "numpy==2.5.5", "olala-quant"]

[tool.uv.sources]
olala-quant = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moegptq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D", "ANN", "SIM", "RUF"]
ignore = ["D203", "D213", "D413", "D401", "D301", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"tools/*" = ["D", "ANN", "E501", "I001"]
